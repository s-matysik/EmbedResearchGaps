[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "embedresearchgaps"
version = "1.1.0"
description = "Embedding-driven identification of research gaps in author-keyword space"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.txt" }
authors = [
    { name = "Sebastian Matysik", email = "sebastian.matysik@usz.edu.pl" },
    { name = "Joanna Wisniewska", email = "joanna.wisniewska@usz.edu.pl" },
    { name = "Pawel Karol Frankowski", email = "p.frankowski@pm.szczecin.pl" },
]
keywords = [
    "systematic literature review",
    "research gaps",
    "semantic embeddings",
    "bibliometrics",
    "keyword clustering",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "networkx>=3.0",
    "kneed>=0.8",
    "requests>=2.31",
    "typer>=0.12",
]

[project.optional-dependencies]
sbert = ["sentence-transformers>=2.6"]
agreement = ["krippendorff>=0.6"]
excel = ["openpyxl>=3.1"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "openpyxl>=3.1",
    "krippendorff>=0.6",
]
all = [
    "sentence-transformers>=2.6",
    "krippendorff>=0.6",
    "openpyxl>=3.1",
]

[project.urls]
Homepage = "https://github.com/s-matysik/EmbedResearchGaps"
Repository = "https://github.com/s-matysik/EmbedResearchGaps"
Documentation = "https://github.com/s-matysik/EmbedResearchGaps#readme"
Issues = "https://github.com/s-matysik/EmbedResearchGaps/issues"

[project.scripts]
embedresearchgaps = "embedresearchgaps.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.coverage.run]
source = ["embedresearchgaps"]
branch = true
